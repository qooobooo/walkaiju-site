<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkaiju</title>
<style>
:root { --bg: #FDF9EC; --surface: #FFFDF6; --text: #023455; --dim: #4F6B80; --line: #E2D3AE; --mark: #FED557; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #012641; --surface: #023455; --text: #FDF9EC; --dim: #A9BCCB; --line: #1D4A6B; --mark: #FED557; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
nav { display: flex; gap: 8px; margin-bottom: 32px; }
nav a { padding: 6px 14px; border: 2px solid var(--text); border-radius: 999px; color: var(--text);
  text-decoration: none; font-weight: 700; font-size: 15px; }
section + section { margin-top: 56px; padding-top: 40px; border-top: 2px solid var(--line); }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 20px; margin: 32px 0 8px; }
.meta { color: var(--dim); font-size: 15px; margin: 0 0 24px; }
ul { padding-left: 22px; margin: 8px 0; }
li { margin: 6px 0; }
a { color: inherit; }
strong { box-shadow: inset 0 -0.35em 0 color-mix(in srgb, var(--mark) 55%, transparent); }
</style>
</head>
<body>
<main>
<h1>Walkaiju</h1>
<p>Ты гуляешь. Кайдзю растёт.</p>
<p><a href="privacy/">Политика конфиденциальности · Privacy Policy</a></p>
</main>
</body>
</html>
